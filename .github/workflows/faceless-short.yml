name: Generate faceless Shorts

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic for both shorts, or "auto" to let the model choose a fresh one
        required: false
        default: auto
        type: string
      fact_style:
        description: Style for the factual explainer short
        required: true
        default: inside-out
        type: choice
        options:
          - inside-out
          - deep-dive
          - stick-story
          - paper-atlas
          - night-file
          - tall-tale
      story_style:
        description: Style for the story short
        required: true
        default: stick-story
        type: choice
        options:
          - stick-story
          - tall-tale
          - paper-atlas
          - inside-out
          - deep-dive
          - night-file
      model:
        description: OpenCode Go model (must be present in the Go catalog)
        required: true
        default: opencode-go/glm-5.3-flash
        type: choice
        options:
          - opencode-go/glm-5.3-flash
          - opencode-go/mimo-v2.6-flash
          - opencode-go/deepseek-v4.1-flash
          - opencode-go/qwen3.8-flash
          - opencode-go/minimax-m3.1-flash
          - opencode-go/gpt-6-luna
          - opencode-go/claude-haiku-5-5
          - opencode-go/glm-5.3
          - opencode-go/kimi-k3
          - opencode-go/kimi-k3.1-pro
          - opencode-go/grok-4.7
          - opencode-go/gemini-4-argon
      upload_to_youtube:
        description: Upload both shorts to YouTube
        required: true
        default: false
        type: boolean
      youtube_visibility:
        description: YouTube visibility when upload is enabled (private is the default)
        required: true
        default: private
        type: choice
        options:
          - private
          - unlisted
          - public
      upload_from_artifact_id:
        description: Skip generation and upload the videos from an earlier run artifact id
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: faceless-shorts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip

      - name: Verify headless browser
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              "$browser" --version
              exit 0
            fi
          done
          echo "::error::Google Chrome or Chromium is required by the faceless-shorts skill, but none was found."
          exit 1

      - name: Install OpenCode CLI
        run: |
          npm install --global @opencode/cli@2.3.0
          opencode --help >/dev/null
          echo "OpenCode CLI 2.3.0 installed."

      - name: Install project dependencies
        run: npm ci

      - name: Run helper tests
        run: npm test

      - name: Verify OpenCode Go model access
        if: ${{ inputs.upload_from_artifact_id == '' }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_FREE_MODELS: '1'
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "::error::The OPENCODE_API_KEY repository secret is not set."
            exit 1
          fi
          available="$(opencode models --standalone)"
          if ! grep -Fxq "$MODEL" <<< "$available"; then
            echo "::error::Model '$MODEL' is not available to this OpenCode Go key. No fallback model will be used."
            echo "$available" | sed 's/^/  /'
            exit 1
          fi
          echo "Using $MODEL"

      - name: Prepare faceless-shorts skill
        if: ${{ inputs.upload_from_artifact_id == '' }}
        timeout-minutes: 30
        run: |
          chmod +x .opencode/skills/faceless-shorts/scripts/*.sh .opencode/skills/faceless-shorts/scripts/py
          bash .opencode/skills/faceless-shorts/scripts/setup.sh

      - name: Generate the fact short and the story short
        if: ${{ inputs.upload_from_artifact_id == '' }}
        timeout-minutes: 210
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_FREE_MODELS: '1'
          MODEL: ${{ inputs.model }}
          FACT_STYLE: ${{ inputs.fact_style }}
          STORY_STYLE: ${{ inputs.story_style }}
          TOPIC: ${{ inputs.topic }}
          SHORT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
          GENERATED_ROOT: ${{ github.workspace }}/.generated
        run: |
          set -uo pipefail
          mkdir -p "$GENERATED_ROOT"

          # Web search needs an interactive provider choice, which CI cannot answer, and a
          # cancelled tool call aborts the whole run. Turn the tool off instead.
          cat > .opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "websearch": false
          }
          JSON

          cat > "$RUNNER_TEMP/build-prompt.mjs" <<'NODE'
          import fs from 'node:fs';

          const [root, kind, topicArg] = process.argv.slice(2);
          const { FACT_STYLE, STORY_STYLE, SHORT_NAME } = process.env;
          if (!FACT_STYLE || !STORY_STYLE || !SHORT_NAME || !root || (kind !== 'fact' && kind !== 'story')) {
            throw new Error('Missing generation prompt environment.');
          }

          const style = kind === 'fact' ? FACT_STYLE : STORY_STYLE;
          const name = `${SHORT_NAME}-${kind}`;
          const dir = `${root}/${name}`;
          const auto = !topicArg || topicArg.trim().toLowerCase() === 'auto';

          const rules = `Rules:
          - Do not ask questions or wait for approval. The skill's "Build it?" step is pre-approved.
          - Read .opencode/skills/faceless-shorts/styles/<style>/STYLE.md in full before you plan anything.
          - Do not create the project directory yourself. Run: bash .opencode/skills/faceless-shorts/scripts/new_video.sh <style> <project-name> --dir ${root}
          - Run every project command with the project directory as the working directory.
          - Use the skill defaults: voice am_michael, the built-in music bed that fits the topic, a 30-45 second length, and the style's end line.
          - Web search is switched off in this environment. Never call a Web Search tool; it aborts the run. To check a fact, use WebFetch on a specific URL (an official page, for example). If a fetch fails, carry on without that source and do not claim you verified it.

          Composition safety. The frame is 1080x1920 and this is a hard rule:
          - Keep every person, prop, label, and caption fully inside the frame, at least 90 px from the left and right edges and 60 px from the top and bottom.
          - Never place a subject centre closer than 220 px to the left or right edge, or make it wider than 760 px. Account for the camera punch-in and drift: when the shot zooms, pull the subject further in.
          - In 2D styles keep full-body figure centres between x=300 and x=780. The outer 220 px on each side is a dead zone.
          - Nothing important may be cut off at any edge. Figures and props half outside the frame are the most common failure.

          Script quality bar. This is what separates a good short from a bad one, so hold to it:
          - About 90-110 spoken words for a 30-45 s short, split into 10-12 lines.
          - Each line is one cut: a full, flowing sentence broken at natural pauses, 5-12 words, under 70 characters.
          - Every line carries a caps string: 1-3 word chunks split with | and exactly one *highlighted* word per chunk.
          - Write a sources list of real, checkable references with URLs. Prefer primary sources (NASA, WHO, CDC, peer-reviewed papers). Never invent a statistic, quote, date, or event. Drop any claim you cannot source.
          - Write like a person talking to a friend: connecting words, no list of caption-like fragments.

          Shots:
          - Rewrite src/shots.js: one shot per line (two for long lines), placed with cut(i), key moments on words with Wd('word', line).
          - Reuse the kit in src/core. Add new components only when the topic needs them, and keep them in the style's look.
          - The visuals must carry the idea: a specific object, action, or diagram per line, not a mood.

          Build order (do not skip or reorder):
          1. bash .opencode/skills/faceless-shorts/scripts/py .opencode/skills/faceless-shorts/scripts/voice.py <project-dir>
          2. bash .opencode/skills/faceless-shorts/scripts/py .opencode/skills/faceless-shorts/scripts/words.py <project-dir>
          3. node tools/capture.mjs check   (must print CHECK OK; fix and rerun until it does)
          4. node tools/capture.mjs cues
          5. bash .opencode/skills/faceless-shorts/scripts/py tools/mix.py .
          6. node tools/capture.mjs sheet review/all.jpg 0.5 10

          QA is mandatory, not optional:
          - Open review/all.jpg with your image reader and read the whole sheet, then open key frames full size: node tools/capture.mjs frames review/f "4.2,8.0".
          - Fix what you find: captions landing early or misspelled, text inside the caption zone (y 1250-1550), props appearing before their cause, off-palette colors, unreadable words, collisions.
          - Look at the outer edges of every tile. If a person, prop, label, or caption is cut off at any edge, move it inward and re-render.
          - Re-render the sheet and look again. Never ship a frame you have not looked at.

          Render:
          - node tools/capture.mjs video renders/final.mp4
          - Export a 9:16 JPEG thumbnail from a frame you inspected to <project-dir>/renders/thumbnail.jpg. Avoid black or faded frames.
          - For 3D styles (deep-dive, night-file, tall-tale) use the skill's software rendering: SOFTWARE_GL=1 QS='&res=0.6&aa=0&shadow=1024' FPS=24.

          Housekeeping:
          - This is a headless runner: do not try to open the MP4 or any GUI application.
          - Do not upload, commit, push, or modify the repository. Keep project outputs under ${root}; temporary files and the skill's model cache are fine.
          - Report the word count, the number of lines, the QA issues you found and fixed, and the final duration, then end with exactly these two lines:
          RESULT_MP4=<project-dir>/renders/final.mp4
          RESULT_THUMBNAIL=<project-dir>/renders/thumbnail.jpg
          `;

          const brief = kind === 'fact'
            ? (auto
              ? `A factual explainer short. Choose one specific, surprising, well-documented topic yourself, then make one clear idea land for a viewer who has never heard of it. Use only well-established facts. Do not default to black holes, space, or AI. State the chosen topic in your first report line.`
              : `A factual explainer short about the topic below. Make one clear idea land for a viewer who has never heard of it. Use only well-established facts.\n\nTopic: ${topicArg}`)
            : (auto
              ? `A short original story. Choose one small, concrete idea yourself. Do not default to black holes, space, or AI. Give it a protagonist, a concrete goal, a complication, a decisive action, and an earned payoff. Original fiction only: no real private people, no existing franchise characters, no copied scripts or shots. If the story states a real-world fact, source it; if it is pure fiction, keep the sources list empty or note that it makes no factual claims. State the chosen idea in your first report line.`
              : `A short original story inspired by the topic below. Give it a protagonist, a concrete goal, a complication, a decisive action, and an earned payoff. Original fiction only: no real private people, no existing franchise characters, no copied scripts or shots. If the story states a real-world fact, source it; if it is pure fiction, keep the sources list empty or note that it makes no factual claims.\n\nTopic: ${topicArg}`);

          const prompt = `@faceless-shorts

          You are running non-interactively in GitHub Actions. Use the faceless-shorts skill at .opencode/skills/faceless-shorts to produce exactly one finished vertical Short. This is the ${kind} short of a two-video run.

          Style: ${style}
          Brief: ${brief}
          Project name: ${name}
          Project directory: ${dir}
          Generated root: ${root}

          ${rules}

          RESULT_MP4=${dir}/renders/final.mp4
          RESULT_THUMBNAIL=${dir}/renders/thumbnail.jpg
          `;

          fs.writeFileSync(`${root}/${kind}-prompt.txt`, prompt
            .replaceAll('<style>', style)
            .replaceAll('<project-name>', name)
            .replaceAll('<project-dir>', dir), 'utf8');
          NODE

          fact_topic="${TOPIC:-auto}"
          node "$RUNNER_TEMP/build-prompt.mjs" "$GENERATED_ROOT" fact "$fact_topic"

          if [ ! -s "$GENERATED_ROOT/fact-prompt.txt" ]; then
            echo "::error::Prompt generation failed; the fact prompt was not written."
            exit 1
          fi

          fact_status=0
          opencode run --standalone --model "$MODEL" --agent build --auto --archived "$(cat "$GENERATED_ROOT/fact-prompt.txt")" || fact_status=$?

          # In auto mode the story follows the subject the fact short chose, when it is readable.
          story_topic="$fact_topic"
          if [ "$(printf '%s' "$fact_topic" | tr '[:upper:]' '[:lower:]' | xargs)" = "auto" ]; then
            story_topic="$(node -e 'try { const s = require(process.argv[1]); if (typeof s.title === "string" && s.title.trim()) console.log(s.title.trim()) } catch {}' "$GENERATED_ROOT/$SHORT_NAME-fact/script.json" 2>/dev/null || true)"
            if [ -z "$story_topic" ]; then
              story_topic="auto"
            fi
          fi

          node "$RUNNER_TEMP/build-prompt.mjs" "$GENERATED_ROOT" story "$story_topic"

          if [ ! -s "$GENERATED_ROOT/story-prompt.txt" ]; then
            echo "::error::Prompt generation failed; the story prompt was not written."
            exit 1
          fi

          story_status=0
          opencode run --standalone --model "$MODEL" --agent build --auto --archived "$(cat "$GENERATED_ROOT/story-prompt.txt")" || story_status=$?

          if [ "$fact_status" -ne 0 ] || [ "$story_status" -ne 0 ]; then
            echo "::warning::An OpenCode run exited non-zero (fact $fact_status, story $story_status). The collection step decides whether usable videos were produced."
          fi

      - name: Download an earlier run artifact
        if: ${{ inputs.upload_from_artifact_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.upload_from_artifact_id }}
        run: |
          set -euo pipefail
          if ! [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::upload_from_artifact_id must be a numeric artifact id, got '$ARTIFACT_ID'."
            exit 1
          fi
          mkdir -p artifacts
          curl -sSL --fail \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/artifact.zip"
          unzip -o -q "$RUNNER_TEMP/artifact.zip" -d artifacts

          # upload-artifact can nest files in a directory; normalise them to artifacts/<kind>-<name>.
          for kind in fact story; do
            for suffix in short.mp4 thumbnail.jpg script.json contact-sheet.jpg; do
              name="$kind-$suffix"
              if [ ! -s "artifacts/$name" ]; then
                found="$(find artifacts -type f -name "$name" | head -1)"
                if [ -n "$found" ]; then
                  mv "$found" "artifacts/$name"
                fi
              fi
            done
          done

          ls -l artifacts
          for kind in fact story; do
            if [ ! -s "artifacts/$kind-short.mp4" ]; then
              echo "::error::The artifact does not contain $kind-short.mp4."
              exit 1
            fi
          done

      - name: Collect both MP4s and thumbnails
        if: ${{ always() && inputs.upload_from_artifact_id == '' }}
        env:
          SHORT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
          GENERATED_ROOT: ${{ github.workspace }}/.generated
        run: |
          set -euo pipefail
          mkdir -p artifacts
          failed=0

          probe_size() {
            ffprobe -v error -select_streams v:0 -show_entries "stream=$1" -of default=noprint_wrappers=1:nokey=1 "$2" | head -1
          }

          collect_one() {
            label="$1"
            dir="$2"
            mp4="$dir/renders/final.mp4"
            thumb="$dir/renders/thumbnail.jpg"

            if [ ! -s "$mp4" ]; then
              echo "::error::The $label short did not produce $mp4"
              find "$dir" -maxdepth 4 -type f 2>/dev/null | sed 's/^/  /' || true
              failed=1
              return 0
            fi

            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$mp4")"
            if ! awk -v d="$duration" 'BEGIN { if (d < 15 || d > 180) exit 1 }'; then
              echo "::error::The $label video is ${duration}s; a Short must be at least 15s and at most 180s. A 15s or shorter result means the script was too thin - rewrite it with 90-110 words over 10-12 lines."
              failed=1
              return 0
            fi

            width="$(probe_size width "$mp4")"
            height="$(probe_size height "$mp4")"
            if ! [[ "$width" =~ ^[0-9]+$ ]] || ! [[ "$height" =~ ^[0-9]+$ ]] || [ "$height" -le "$width" ]; then
              echo "::error::The $label video is not vertical (detected ${width:-?}${height:+x$height}); a Short must be portrait."
              failed=1
              return 0
            fi

            if ! ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of default=noprint_wrappers=1:nokey=1 "$mp4" | grep -qx audio; then
              echo "::error::The $label MP4 has no audio stream; narration was not mixed."
              failed=1
              return 0
            fi

            if ! ffmpeg -v info -i "$mp4" -af volumedetect -vn -f null - 2>&1 | awk '/mean_volume:/ { v=$0; sub(/.*mean_volume: */, "", v); sub(/ .*/, "", v); found=1; if (v !~ /^-?[0-9]+(\.[0-9]+)?$/) bad=1; else if (v + 0 <= -50) bad=1 } END { exit (found && !bad ? 0 : 1) }'; then
              echo "::error::The $label MP4 audio is silent or could not be measured."
              failed=1
              return 0
            fi

            if [ ! -s "$thumb" ]; then
              seek="$(awk -v d="$duration" 'BEGIN { s = d / 2; if (s > 2) s = 2; if (s < 0) s = 0; printf "%.2f", s }')"
              ffmpeg -v error -ss "$seek" -i "$mp4" -frames:v 1 -q:v 2 -y "$thumb"
              echo "::warning::The agent did not write a thumbnail for the $label short; extracted a frame at ${seek}s instead."
            fi

            if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$thumb" >/dev/null; then
              echo "::error::The $label thumbnail is not a readable image."
              failed=1
              return 0
            fi

            thumb_width="$(probe_size width "$thumb")"
            thumb_height="$(probe_size height "$thumb")"
            if ! [[ "$thumb_width" =~ ^[0-9]+$ ]] || ! [[ "$thumb_height" =~ ^[0-9]+$ ]] || [ "$thumb_height" -le "$thumb_width" ]; then
              echo "::error::The $label thumbnail is not portrait (detected ${thumb_width:-?}x${thumb_height:-?}); Shorts thumbnails should be 9:16."
              failed=1
              return 0
            fi

            thumb_bytes="$(stat -c%s "$thumb")"
            if [ "$thumb_bytes" -gt 52428800 ]; then
              echo "::error::The $label thumbnail is larger than YouTube's 50 MB API limit."
              failed=1
              return 0
            fi

            cp "$mp4" "artifacts/$label-short.mp4"
            cp "$thumb" "artifacts/$label-thumbnail.jpg"
            if [ -s "$dir/script.json" ]; then
              cp "$dir/script.json" "artifacts/$label-script.json"
            fi
            if [ -s "$dir/review/all.jpg" ]; then
              cp "$dir/review/all.jpg" "artifacts/$label-contact-sheet.jpg"
            fi

            echo "$label short: $mp4 (${duration}s, ${width}x${height}), thumbnail ${thumb_bytes} bytes"
          }

          collect_one fact "$GENERATED_ROOT/$SHORT_NAME-fact"
          collect_one story "$GENERATED_ROOT/$SHORT_NAME-story"

          exit $failed

      - name: Upload both shorts to YouTube
        if: ${{ inputs.upload_to_youtube == true }}
        timeout-minutes: 90
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FACT_STYLE: ${{ inputs.fact_style }}
          STORY_STYLE: ${{ inputs.story_style }}
          VISIBILITY: ${{ inputs.youtube_visibility }}
        run: |
          set -uo pipefail
          if [ "$VISIBILITY" != "private" ] && [ "$VISIBILITY" != "unlisted" ] && [ "$VISIBILITY" != "public" ]; then
            echo "::error::Invalid youtube_visibility '$VISIBILITY'. Use private, unlisted, or public."
            exit 1
          fi

          uploaded=0
          fact_status=0
          story_status=0

          if [ -s artifacts/fact-short.mp4 ]; then
            node scripts/youtube-upload.mjs \
              --video artifacts/fact-short.mp4 \
              --thumbnail artifacts/fact-thumbnail.jpg \
              --metadata artifacts/fact-script.json \
              --style "$FACT_STYLE" \
              --privacy "$VISIBILITY" \
              --report artifacts/fact-upload.json || fact_status=$?
            uploaded=$((uploaded + 1))
          else
            echo "::warning::No fact video to upload; skipping."
          fi

          if [ -s artifacts/story-short.mp4 ]; then
            node scripts/youtube-upload.mjs \
              --video artifacts/story-short.mp4 \
              --thumbnail artifacts/story-thumbnail.jpg \
              --metadata artifacts/story-script.json \
              --style "$STORY_STYLE" \
              --privacy "$VISIBILITY" \
              --report artifacts/story-upload.json || story_status=$?
            uploaded=$((uploaded + 1))
          else
            echo "::warning::No story video to upload; skipping."
          fi

          if [ "$uploaded" -eq 0 ]; then
            echo "::error::YouTube upload was requested but no video was available to upload."
            exit 1
          fi

          if [ "$fact_status" -ne 0 ] || [ "$story_status" -ne 0 ]; then
            echo "::error::A YouTube upload failed (fact exit $fact_status, story exit $story_status). See artifacts/*-upload.json."
            exit 1
          fi

      - name: Upload MP4s and thumbnails artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faceless-shorts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Write job summary
        if: always()
        env:
          FACT_STYLE: ${{ inputs.fact_style }}
          STORY_STYLE: ${{ inputs.story_style }}
          MODEL: ${{ inputs.model }}
          UPLOAD_REQUESTED: ${{ inputs.upload_to_youtube }}
        run: |
          {
            echo "## Faceless Shorts"
            echo ""
            echo "- Fact short style: \`$FACT_STYLE\`"
            echo "- Story short style: \`$STORY_STYLE\`"
            echo "- Model: \`$MODEL\`"
            echo "- YouTube upload requested: \`$UPLOAD_REQUESTED\`"
            echo "- Artifact: \`faceless-shorts-${{ github.run_id }}-${{ github.run_attempt }}\`"
            echo "- Download: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            for report in artifacts/fact-upload.json artifacts/story-upload.json; do
              if [ -f "$report" ]; then
                url="$(sed -n 's/.*"url": "\([^"]*\)".*/\1/p' "$report" | head -1)"
                if [ -n "$url" ]; then
                  echo "- Published: $url"
                fi
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
