# Legacy renderer: Piper TTS + rsvg vector scenes. It does NOT use the faceless-shorts skill
# and it uploads its own 10-20 s clips to the channel. For skill-quality Shorts use
# "Generate faceless Short" (faceless-short.yml). Disable this workflow if you only publish
# from the skill pipeline.
name: Legacy Shorts Pipeline (Piper + SVG renderer, not the skill)

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin fonts-dejavu-core

      - name: Install Piper and download licensed voice
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install piper-tts
          .venv/bin/python -m piper.download_voices en_US-ljspeech-high --data-dir assets/piper

      - name: Install dependencies
        run: npm ci

      - name: Verify pipeline helpers
        run: npm test

      - name: Render and upload unlisted Shorts
        env:
          OPENCODE_ZEN_KEY: ${{ secrets.OPENCODE_ZEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIPER_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm start

      - name: Save rendered videos and thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-preview-${{ github.run_id }}
          path: |
            shorts_cinematic.mp4
            shorts_facts.mp4
            shorts_cinematic_thumbnail.jpg
            shorts_facts_thumbnail.jpg
            shorts_upload_status.json
          if-no-files-found: ignore
          retention-days: 7